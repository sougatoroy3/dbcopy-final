<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="auth-container">
        <h2>Login</h2>
        <form id="loginForm">
          <label for="email">Email:</label>
          <input type="email" id="email" required>
          <label for="password">Password:</label>
          <input type="password" id="password" required>
          <button type="submit">Login</button>
        </form>
        <p>New user? <a href="signup.html">Sign up here</a></p>
        <p id="error-message"></p>
    </div>

    <!-- Firebase setup -->
    <script type="module">
      import { initializeApp } from 'https://www.gstatic.com/firebasejs/9.17.1/firebase-app.js';
      import { getAuth, signInWithEmailAndPassword } from 'https://www.gstatic.com/firebasejs/9.17.1/firebase-auth.js';
      
      // Your web app's Firebase configuration
      const firebaseConfig = {
        apiKey: "AIzaSyDVU2o_B4YcvTGO1ujZDLg1UFIElCEhaGo",
        authDomain: "cisco-devices-dashboard.firebaseapp.com",
        databaseURL: "https://cisco-devices-dashboard-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "cisco-devices-dashboard",
        storageBucket: "cisco-devices-dashboard.firebasestorage.app",
        messagingSenderId: "507256484820",
        appId: "1:507256484820:web:ce22e248db92f564629c41",
        measurementId: "G-5ZRX3ET070"
      };

      // Initialize Firebase
      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);

      document.getElementById('loginForm').addEventListener('submit', function (e) {
        e.preventDefault();
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        console.log('Email:', email);
        console.log('Password:', password);

        signInWithEmailAndPassword(auth, email, password)
          .then((userCredential) => {
            
            // After successful login, we will get the user object
            const user = userCredential.user;

            if (!user.emailVerified) 
            {
              throw new Error('Email not verified. Please verify your email before logging in.');
            }

            
            // Check the email and redirect accordingly
            if (email === 'sabid.c@velocis.in' || email === 'muhammed.anees@velocis.in' || email === 'sougatoroy007@gmail.com' || email === 'arunkumar.roy@velocis.in') {
              console.log('Login Successful:', userCredential.user);
              window.location.href = 'devicesADMIN.html';  // Redirect to Admin page
            } 
            else {
              console.log('Login Successful:', userCredential.user);
              window.location.href = 'devicesUSER.html';  // Redirect to User page
            }
          })
          .catch((error) => {
            const errorCode = error.code;
            const errorMessage = error.message;

            switch (errorCode) {
              case 'auth/user-not-found':
                alert('No user found with this email.');
                break;
              case 'auth/wrong-password':
                alert('Incorrect password.');
                break;
              case 'auth/email-not-verified':
                alert('Email not verified. Please check your inbox.');
                break;
              default:
                alert(`Login failed. Please try again.${errorMessage}`);
                break;
            }
            document.getElementById('error-message').innerText = errorCode;
          });
        });
    </script> 
</body>
</html>
