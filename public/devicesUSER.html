<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Devices Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <style>
  
    .device-container {
      margin: 20px;
      position: relative;
      background-image: url('./1stFloor.png'); /* Background image */
      background-size: cover; /* Ensure the image covers the entire container */
      background-position: center; /* Center the image */
      width: 800px;
      height: 500px; /* Adjust height to fit the image dimensions */
      border: 1px solid #ccc;
      border-radius: 10px;
      overflow: hidden;
    }

    .device-list {
      position: relative;
      width: 100%;
      height: 100%;
      background-color: transparent;
    }

    .device {
      position: absolute; /* Allow precise positioning */
      color: white; /* Make text white for visibility */
      font-size: 17px;
      font-weight: bold;
      background-color: rgba(0, 0, 0, 0.6); /* Semi-transparent black background for better readability */
      padding: 5px 10px;
      border-radius: 5px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .device:hover {
      transform: scale(1.05);
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
    }
    
    .dialog {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background-color: white;
      padding: 20px;
      border: 1px solid #ccc;
      border-radius: 10px;
      width: 50%;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
    }

    .details-box table {
      width: 100%;
      border-collapse: collapse;
    }

    .details-box table, .details-box th, .details-box td {
      border: 1px solid #ddd;
    }

    .details-box th, .details-box td {
      padding: 8px;
      text-align: left;
    }

    .details-box th {
      background-color: #f2f2f2;
    }

    .details-box td {
      font-size: 14px;
    }

    #closeDialog {
      position: absolute;
      top: 10px;
      right: 10px;
      padding: 5px 10px;
      background-color: #f30c0c;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    #detailedReportButton {
      margin-top: 10px;
      background-color: #28a745;
      color: white;
      padding: 5px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    #logoutContainer {
      position: absolute;
      top: 10px;
      right: 10px;
    }

    #logoutButton {
      padding: 10px 20px;
      background-color: #f30c0c;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 14px;
    }

    #logoutButton:hover {
      background-color: #d40909;
    }

    .user-banner {
      position: absolute;
      top: 10px;
      left: 50%;
      margin: 20px;
      padding: 10px;
      background-color: #d1ecf1;
      border: 5px solid #0ddc09;
      transform: translateX(-50%);
      font-size: 18px;
      color: #0c5460;
    }
  </style>
</head>
<body>

    <div class="user-banner">
      <p>You are logged in as <strong>USER</strong></p>
    </div>
    <div class="device-container">
        <input type="text" id="searchBar" placeholder="Search for devices...">
        <div id="deviceList" class="device-list"></div>
        </div>
    </div>

    <!--Logout Button-->
    <div id="logoutContainer">
      <button id="logoutButton">Logout</button>
    </div>

    <!-- Dialog Box for Call Quality -->
    <div id="dialog" class="dialog">
      <h2>📊Room Report</h2>
      <div id="detailsSummary">
        <h4 id="callQualityStatus"> Call Quality as per current status will be:</h4>
        <button id="detailedReportButton">Show Detailed Report</button>
      </div>
      <div id="details" class="details-box"></div>
        <!-- Details will be added here -->
        <button id="closeDialog">✖️</button>
      </div>
    </div>
      </div>
    </div>

    <script>
        // Devices array
        const devices = ['VENUS', 'MARS', 'JUPITER', 'SKYLAB', 'PLUTO', 'DC Cabin'];
        const deviceList = document.getElementById('deviceList');
        const dialog = document.getElementById('dialog');
        const closeDialogButton = document.getElementById('closeDialog');
        const detailsDiv = document.getElementById('details');
        const detailedReportButton = document.getElementById('detailedReportButton');
        const devicePositions = {
          'VENUS': { top: '55px', left: '681px', width: '97px', height: '163px'},
          'MARS': { top: '-28px', left: '432px', width: '125px', height: '67px' },
          'JUPITER': { top: '-28px', left: '0px', width: '125px', height: '67px' },
          'SKYLAB': { top: '55px', left: '250px', width: '97px', height: '163px' },
          'PLUTO': { top: '-29px', left: '585px', width: '72px', height: '68px'  },
          'DC Cabin': { top: '435px', left: '0px', width: '80px', height: '25px'  },
        };

        const logoutButton = document.getElementById('logoutButton');

        logoutButton.addEventListener('click', () => {
          // Perform any cleanup or logout operations here if necessary
          window.location.href = 'index.html'; // Redirect to index.html
        });

        // Render devices list
        function renderDeviceList() {
          deviceList.innerHTML = '';
          devices.forEach(device => {
            const div = document.createElement('div');
            div.className = 'device';
            div.innerText = device;
            
            // Set the position of each device
            if (devicePositions[device]) {
              div.style.top = devicePositions[device].top;
              div.style.left = devicePositions[device].left;
              div.style.width = devicePositions[device].width; // Set custom width
              div.style.height = devicePositions[device].height; // Set custom height
              div.style.lineHeight = devicePositions[device].height; // Align text vertically
            }

            div.onclick = () => showDeviceDetails(device, div);
            deviceList.appendChild(div);

            // Fetch the status for each device
            fetch(`http://localhost:5500/fetch-status?device=${device}`)
              .then(response => {
                if (!response.ok) {
                  throw new Error(`Network response was not ok. ${response.status}`);
                }
                return response.json();
              })
              .then(data => {
                if (data.error) {
                  div.style.backgroundColor = '#f8d7da'; // Light red for errors
                  div.style.color = '#721c24'; // Dark red text
                  div.innerText += ` (Error)`;
                } else {
                  if (data.availabilityStatus === 'Free' || data.availabilityStatus === 'FreeUntil') {
                    div.style.backgroundColor = '#28a745'; // Green for available
                    div.style.color = 'white';
                  } else {
                    div.style.backgroundColor = '#dc3545'; // Red for unavailable
                    div.style.color = 'white';
                  }
                }

                // Add click event to show detailed status
                div.onclick = () => showDeviceDetails(device, div);
              })
              .catch(error => {
                console.error(`Error fetching status for device ${device}:`, error);
                div.style.backgroundColor = '#f8d7da'; // Light red for errors
                div.style.color = '#721c24'; // Dark red text
              });
          });
        }
    
        // Filter devices by search query
        document.getElementById('searchBar').addEventListener('input', function() {
          const query = this.value.toLowerCase();
          const filteredDevices = devices.filter(device => device.toLowerCase().includes(query));
          deviceList.innerHTML = '';
          filteredDevices.forEach(device => {
            const div = document.createElement('div');
            div.className = 'device';
            div.innerText = device;
            div.onclick = () => showDeviceDetails(device);
            deviceList.appendChild(div);
          });
        });
        
        
        // Display device details (mocked data)
        function showDeviceDetails(device, deviceElement) 
        {
          fetch(`http://localhost:5500/fetch-status?device=${device}`)
            .then((response) => {
              if (!response.ok) 
              {
                throw new Error(`Network response was not ok. ${response.status}`);
              }
              return response.json();
            })
            .then((data) => {
              if(data.error)
              {
                dialog.style.display = 'block';
                document.getElementById('callQualityStatus').innerText = `Error: ${data.error}`;
                detailsDiv.innerHTML = `<h4>Invalid device selected or data not available.</h4>`;
              }
              dialog.style.display = 'block';
              document.getElementById('callQualityStatus').innerText = `${data.productId}--${data.systemUnitName}`;

              detailsDiv.innerHTML = `
              <table>

                <tr><th>🏢 Room Availability Report</th><th>Status</th></tr>
                <tr><td>Now the room is:</td><td>${data.availabilityStatus}</td></tr>
                <tr><td>Room is:</td><td>${data.availabilityTimeStamp}</td></tr>
                <tr><td>Room Capacity</td><td>${data.peopleCapacity} 👥</td></tr>
                <tr><td>Room Occupancy</td><td>${data.peopleCurrent} 🚶</td></tr>
                
              </table>`;
              detailsDiv.style.display = 'none';

            })
            .catch(error => {
              console.error('Error fetching status.xml:', error);
              dialog.style.display = 'block';
              document.getElementById('callQualityStatus').innerText = `Error fetching data for device: ${device}`;
              detailsDiv.innerHTML = `<h4>Could not retrieve data. Please try again later.</h4>`;
            });
          } 
        
        // Toggle detailed report
        detailedReportButton.addEventListener('click', () => {
          detailsDiv.style.display = detailsDiv.style.display === 'none' ? 'block' : 'none';
          detailedReportButton.innerText = detailsDiv.style.display === 'none' ? 'Show Detailed Report' : 'Hide Detailed Report';
        });

        // Close the dialog
        closeDialogButton.addEventListener('click', () => {
          dialog.style.display = 'none';
        });
    
        // Initially render the devices
        renderDeviceList();
    </script>
</body>
</html>
