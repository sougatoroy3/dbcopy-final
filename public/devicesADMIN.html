<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Devices Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .device-container {
      margin: 20px;
    }

    .device {
      margin: 5px 0;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
      cursor: pointer;
    }

    .dialog {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background-color: white;
      padding: 20px;
      border: 1px solid #ccc;
      border-radius: 10px;
      width: 50%;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
    }

    .details-box table {
      width: 100%;
      border-collapse: collapse;
      display: block;
      overflow-x: auto;
      white-space: nowrap;
    }

    .details-box table, .details-box th, .details-box td {
      border: 1px solid #ddd;
    }

    .details-box th, .details-box td {
      padding: 8px;
      text-align: left;
    }

    .details-box th {
      background-color: #f2f2f2;
    }

    .details-box td {
      font-size: 14px;
    }

    #closeDialog {
      position: absolute;
      top: 10px;
      right: 10px;
      padding: 5px 10px;
      background-color: #f30c0c;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    #detailedReportButton, #downloadPdfButton {
      margin-top: 10px;
      background-color: #28a745;
      color: white;
      padding: 5px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    #downloadPdfButton {
      margin-left: 10px;
      background-color: #007bff;
    }
  </style>
</head>
<body>
    <div class="device-container">
        <input type="text" id="searchBar" placeholder="Search for devices...">
        <div id="deviceList" class="device-list"></div>
    </div>

    <!-- Dialog Box for Call Quality -->
    <div id="dialog" class="dialog">
      <h2>📊Room Report</h2>
      <div id="detailsSummary">
        <h4 id="callQualityStatus"> Call Quality as per current status will be:</h4>
        <button id="detailedReportButton">Show Detailed Report</button>
        <button id="downloadPdfButton">Download PDF</button>
      </div>
      <div id="details" class="details-box"></div>
        <!-- Details will be added here -->
        <button id="closeDialog">✖️</button>
      </div>
    </div>
      </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.4.0/jspdf.umd.min.js"></script>
    <script>
        // Devices array
        const devices = ['VENUS', 'MARS', 'JUPITER', 'SKYLAB', 'PLUTO', 'DC Cabin'];
        const deviceList = document.getElementById('deviceList');
        const dialog = document.getElementById('dialog');
        const closeDialogButton = document.getElementById('closeDialog');
        const detailsDiv = document.getElementById('details');
        const detailedReportButton = document.getElementById('detailedReportButton');
        const downloadPdfButton = document.getElementById('downloadPdfButton');
    
        // Render devices list
        function renderDeviceList() {
          deviceList.innerHTML = '';
          devices.forEach(device => {
            const div = document.createElement('div');
            div.className = 'device';
            div.innerText = device;
            div.onclick = () => showDeviceDetails(device);
            deviceList.appendChild(div);

            // Fetch the status for each device
            fetch(`http://localhost:5500/fetch-status?device=${device}`)
              .then(response => {
                if (!response.ok) {
                  throw new Error(`Network response was not ok. ${response.status}`);
                }
                return response.json();
              })
              .then(data => {
                if (data.error) {
                  div.style.backgroundColor = '#f8d7da'; // Light red for errors
                  div.style.color = '#721c24'; // Dark red text
                  div.innerText += ` (Error)`;
                } else {
                  if (data.availabilityStatus === 'Free' || data.availabilityStatus === 'FreeUntil') {
                    div.style.backgroundColor = '#28a745'; // Green for available
                    div.style.color = 'white';
                  } else {
                    div.style.backgroundColor = '#dc3545'; // Red for unavailable
                    div.style.color = 'white';
                  }
                }

                // Add click event to show detailed status
                div.onclick = () => showDeviceDetails(device, div);
              })
              .catch(error => {
                console.error(`Error fetching status for device ${device}:`, error);
                div.style.backgroundColor = '#f8d7da'; // Light red for errors
                div.style.color = '#721c24'; // Dark red text
                div.innerText += ` (Error fetching data)`;
              });
          });
        }        
        
        // Filter devices by search query
        document.getElementById('searchBar').addEventListener('input', function() {
          const query = this.value.toLowerCase();
          const filteredDevices = devices.filter(device => device.toLowerCase().includes(query));
          deviceList.innerHTML = '';
          filteredDevices.forEach(device => {
            const div = document.createElement('div');
            div.className = 'device';
            div.innerText = device;
            div.onclick = () => showDeviceDetails(device);
            deviceList.appendChild(div);
          });
        });
        
        
        // Display device details (mocked data)
        function showDeviceDetails(device) 
        {
          fetch(`http://localhost:5500/fetch-status?device=${device}`)
            .then((response) => {
              if (!response.ok) 
              {
                throw new Error(`Network response was not ok. ${response.status}`);
              }
              return response.json();
            })
            .then((data) => {
              if(data.error)
              {
                dialog.style.display = 'block';
                document.getElementById('callQualityStatus').innerText = `Error: ${data.error}`;
                detailsDiv.innerHTML = `<h4>Invalid device selected or data not available.</h4>`;
                return;
              }
              dialog.style.display = 'block';
              document.getElementById('callQualityStatus').innerText = `${data.productId}--${data.systemUnitName}
              Call Quality as per current status will be: ${data.finalStatus} with a score of ${data.score}/10`;

              detailsDiv.innerHTML = `
              <table>
                <tr><th>🏢 Room Analytics Report</th><th>Status</th></tr>
                <tr><td>Room Capacity</td><td>${data.peopleCapacity} 👥</td></tr>
                <tr><td>Room Occupancy</td><td>${data.peopleCurrent} 🚶</td></tr>
                <tr><td>Now the room is:</td><td>${data.availabilityStatus}</td></tr>
                <tr><td>Room is:</td><td>${data.availabilityTimeStamp}</td></tr>
                <tr><td>Ambient Noise</td><td>${data.ambientNoiseLevel}</td></tr>
                <tr><td>Sound Level</td><td>${data.soundLevel}</td></tr>

                <tr><th>🔊 Audio Report</th><th>Status</th></tr>
                <tr><td>Handset USB Connection</td><td>${data.handsetUSBReport} 🎧</td></tr>
                <tr><td>Headset USB Connection</td><td>${data.headsetUSBReport} 🎤</td></tr>
                <tr><td>Microphone Connection</td><td>${data.microphoneReport} 🎙️</td></tr>
                <tr><td>Noise Removal</td><td>${data.noiseRemoval} 🔇</td></tr>
                <tr><td>Voice Activity Detector</td><td>${data.voiceActivityDetector} 🔊</td></tr>

                <tr><th>📷 Camera Report</th><th>Status</th></tr>
                <tr><td>CISCO Integrated Camera</td></tr>
                <tr><td>Camera Connection</td><td>${data.cameraConnectionStatus} 📸</td></tr>
                <tr><td>Camera Frame Rate</td><td>25🎞️</td></tr>
                <tr><td>Lighting Condition</td><td>${data.cameraLightningConditions} 💡</td></tr>
                <tr><td>Speaker Tracker Availability</td><td>${data.speakerTracking}🧏</td></tr>
                <tr><td>Speaker Tracker Status</td><td>${data.speakerTrackingStatus}🧑‍💼</td></tr>

                <tr><th>💻 Peripherals Report</th><th>Status</th></tr>
                <tr><td>Device Name</td><td>${data.deviceName}📛</td></tr>
                <tr><td>Device Type</td><td>TouchPanel🧑‍💻</td></tr>
                <tr><td>Device Status</td><td>${data.deviceStatus} ⚙️</td></tr>
                <tr><td>PinPairing</td><td>${data.pinPairing}</td></tr>

                <tr><th>🧭 Proximity Report</th><th>Status</th></tr>
                <tr><td>Proximity Service</td><td>${data.proximityReport} 📡</td></tr>

                <tr><th>📺 Video Report</th><th>Status</th></tr>
                <tr><td>Main Video Source</td><td>${data.mainVideoSource} 🎥</td></tr>
                <tr><td>Miracast Status</td><td>${data.miracastStatus} 📺</td></tr>
                <tr><td>Monitor Resolution</td><td>${data.connectorResolutionWidth} x ${data.connectorResolutionHeight} at ${data.connectorResolutionRefreshRate}Hz 💻</td></tr>
                <tr><td>AirPlay</td><td>${data.airplayStatus}</td></tr>
                <tr><td>Monitor Name</td><td>${data.monitorName}</td></tr>
                <tr><td>WebCam</td><td>MODE-${data.webcamMode} STATUS-${data.webcamStatus}📹</td></tr>
              </table>`;
              //detailsButton.onclick = () => {
              //  detailsDiv.style.display = detailsDiv.style.display === 'none' ? 'block' : 'none';
              //};
              // Hide detailed report initially
              detailsDiv.style.display = 'none';
            })
            .catch(error => {
              console.error('Error fetching status.xml:', error);
              dialog.style.display = 'block';
              document.getElementById('callQualityStatus').innerText = `Error fetching data for device: ${device}`;
              detailsDiv.innerHTML = `<h4>Could not retrieve data. Please try again later.</h4>`;
            });
          } 
        
        // Toggle detailed report
        detailedReportButton.addEventListener('click', () => {
          detailsDiv.style.display = detailsDiv.style.display === 'none' ? 'block' : 'none';
          detailedReportButton.innerText = detailsDiv.style.display === 'none' ? 'Show Detailed Report' : 'Hide Detailed Report';
        });

        downloadPdfButton.addEventListener('click', () => {
          const { jsPDF } = window.jspdf;
          const doc = new jsPDF();

          doc.setFontSize(16);
          doc.text('Room Report', 10, 10);

          const summaryText = document.getElementById('callQualityStatus').innerText;
          doc.setFontSize(12);
          doc.text(summaryText, 10, 20);

          // Get details table content
          const tableRows = [];
          const table = detailsDiv.querySelector('table');
          const rows = table ? table.querySelectorAll('tr') : [];

          rows.forEach((row, index) => {
            const cells = row.querySelectorAll('td, th');
            const rowData = [];
            cells.forEach(cell => {
              rowData.push(cell.innerText.trim());
            });
            tableRows.push(rowData);
          });

          // Add table content to PDF
          let yOffset = 30;  // Start from position after summary
          tableRows.forEach(row => {
            const rowHeight = 10;
            const cellWidth = 60;
            row.forEach((cell, idx) => {
              doc.text(cell, 10 + idx * cellWidth, yOffset);
            });
            yOffset += rowHeight;
          });

          // Save the PDF
          doc.save('Room_Report.pdf');
        });


        // Close the dialog
        closeDialogButton.addEventListener('click', () => {
          dialog.style.display = 'none';
        });
    
        // Initially render the devices
        renderDeviceList();
    </script>
</body>
</html>
