<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* Modal dialog styles */
    #errorModal {
      display: none; /* Hidden by default */
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.5); /* Semi-transparent background */
      justify-content: center;
      align-items: center;
    }
    .modal-content {
      background-color: #fff;
      padding: 20px;
      border-radius: 5px;
      text-align: center;
      width: 300px;
    }
    .modal-content button {
      margin-top: 20px;
      padding: 10px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    .modal-content button:hover {
      background-color: #45a049;
    }
  </style>
</head>
<body>
    <div class="auth-container">
      <h2>Create Account</h2>
      <form id="signupForm">
        <label for="name">Full Name:</label>
        <input type="text" id="name" placeholder="John Doe" required>
        
        <label for="email">Email:</label>
        <input type="email" id="email" placeholder="name.surname@velocis.in" required>
  
        <label for="password">Password:</label>
        <input type="password" id="password" placeholder="password" required>
  
        <label for="confirm-password">Confirm Password:</label>
        <input type="password" id="confirm-password" placeholder="password" required>
  
        <button type="submit">Sign Up</button>
      </form>

      <!--Dialog box error message-->
      <div id="errorModal">
        <div class="modal-content">
          <p id="modalMessage"></p>
          <button id="okButton">OK</button>
        </div>
      </div>
      
      <p>Already have an account? <a href="login.html">Log in here</a></p> <!-- Link to login page -->
      <p id="error-message"></p>
    </div>

  <!-- Firebase setup -->
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/9.17.1/firebase-app.js';
    import { getAuth, createUserWithEmailAndPassword, sendEmailVerification } from 'https://www.gstatic.com/firebasejs/9.17.1/firebase-auth.js';

    // Your web app's Firebase configuration
    const firebaseConfig = {
      apiKey: "AIzaSyDVU2o_B4YcvTGO1ujZDLg1UFIElCEhaGo",
      authDomain: "cisco-devices-dashboard.firebaseapp.com",
      databaseURL: "https://cisco-devices-dashboard-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "cisco-devices-dashboard",
      storageBucket: "cisco-devices-dashboard.firebasestorage.app",
      messagingSenderId: "507256484820",
      appId: "1:507256484820:web:ce22e248db92f564629c41",
      measurementId: "G-5ZRX3ET070"
    };

    //If email is valid and passwords match then proceed with Firebase signup
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    function validateEmail(email) 
    {
      const emailPattern = /^[^\s@]+@(velocis\.co\.in|velocis\.in|gmail\.com)$/;
      return emailPattern.test(email);
    }

    document.getElementById('signupForm').addEventListener('submit', function(event)
    {
      event.preventDefault();

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirm-password').value;

      //Check email validity
      if(!validateEmail(email))
      {
        showModal('!Use organization mail only!');
        return;
      }

      //Check passwords mismatch
      if(password != confirmPassword)
      {
        showModal('Passwords do not match!');
        return;
      }

      createUserWithEmailAndPassword(auth, email, password)
        .then((userCredential) => {
          const user = userCredential.user;

          // Send verification email
          sendEmailVerification(user)
            .then(() => {
              console.log("Verification email sent to:", user.email);
              showModal('Verification email sent! Verify your email to proceed to login.');
              // Optionally redirect to login page after verification
              setTimeout(() => {
                window.location.href = 'login.html';
              }, 3000);
            })
            .catch((error) => {
              console.error("Error sending verification email:", error);
              console.error("Error message", error.message);
              showModal('Error sending verification email: ' +error.message);
            });
          })
          .catch((error) => {
            console.error("Error creating user:", error);
            showModal(error.message);
          });
        });

      // Function to show the modal with the error message
      function showModal(message) {
        const modal = document.getElementById('errorModal');
        const modalMessage = document.getElementById('modalMessage');
        modalMessage.textContent = message;  // Set the message to be displayed
        modal.style.display = 'flex';  // Show the modal
          
        // Add event listener to "OK" button to refresh the page
        document.getElementById('okButton').addEventListener('click', function() {
          modal.style.display = 'none'; // Hide the modal
        
          // Clear input fields
          document.getElementById('name').value = '';
          document.getElementById('email').value = '';
          document.getElementById('password').value = '';
          document.getElementById('confirm-password').value = '';
        });
      }
  </script>
</body>
</html>
